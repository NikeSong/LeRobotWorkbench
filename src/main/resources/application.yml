server:
  port: 8080

spring:
  application:
    name: lerobot-workbench
  jackson:
    serialization:
      write-dates-as-timestamps: false

lerobot:
  # Absolute or relative path to the LeRobot repo root (parent of workbench/)
  repo-root: ${LEROBOT_REPO_ROOT:..}
  # Default dataset / model home (HF cache style)
  data-home: ${LEROBOT_HOME:${user.home}/.cache/huggingface/lerobot}
  # Python executable used by the local bridge process
  python-bin: ${LEROBOT_PYTHON:uv}
  # When true, run without a live ROS master (in-process mock bus)
  ros:
    enabled: true
    mock: ${LEROBOT_ROS_MOCK:true}
    rosbridge-url: ${ROSBRIDGE_URL:ws://127.0.0.1:9090}
    reconnect-ms: 3000
    # Topic / service namespace used by the Python bridge nodes
    namespace: /lerobot

logging:
  level:
    com.lerobot.workbench: INFO
    root: INFO
