server:
  port: 8080

spring:
  application:
    name: lerobot-workbench
  jackson:
    serialization:
      write-dates-as-timestamps: false

lerobot:
  # Absolute or relative path to the LeRobot repo root (parent of workbench/)
  repo-root: ${LEROBOT_REPO_ROOT:..}
  # Default dataset / model home (HF cache style)
  data-home: ${LEROBOT_HOME:${user.home}/.cache/huggingface/lerobot}
  # uv absolute path (IDE 启动时常没有 ~/.local/bin)。可用 LEROBOT_PYTHON 覆盖
  python-bin: ${LEROBOT_PYTHON:/Users/nixon/.local/bin/uv}
  # mock=true 强制离线演示；默认 false，启动时自动探测 rosbridge
  # Docker 不是必须：优先使用本机 Pixi/RoboStack（native-pixi-project）
  ros:
    enabled: true
    mock: ${LEROBOT_ROS_MOCK:false}
    rosbridge-url: ${ROSBRIDGE_URL:ws://127.0.0.1:9090}
    reconnect-ms: 3000
    namespace: /lerobot
    native-pixi-project: ${LEROBOT_ROS_PIXI:${user.home}/work/dev/ros-learn}

logging:
  level:
    com.lerobot.workbench: INFO
    root: INFO
